<html lang="en">
  <head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var s = localStorage.getItem('mpl.skin');
          var min = Number(localStorage.getItem('mpl.skinMin') || 1);
          var lvl = Number(localStorage.getItem('mpl.level') || 0);
          if (s && min <= lvl) document.documentElement.dataset.skin = s;
        } catch (e) {}
      })();
    </script>
  <title>Brutalist Music Lab</title>
  <meta name="theme-color" content="#121212" />

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  <script>
(function () {
  var APP = 'music';
  var ENDPOINT = 'https://vault-theta-hazel.vercel.app/api/beacon';
  function session() {
    try {
      var key = 'vault_session_v1';
      var value = localStorage.getItem(key);
      if (!value) {
        value = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2);
        localStorage.setItem(key, value);
      }
      return value;
    } catch (e) { return ''; }
  }
  var lastTarget = '';
  function send() {
    var current = location.pathname + location.hash;
    if (current === lastTarget) return;
    lastTarget = current;
    try {
      var payload = JSON.stringify({
        app: APP,
        kind: 'view',
        target: location.pathname + location.hash,
        path: location.pathname + location.hash,
        title: document.title,
        session: session(),
        referrer: document.referrer || ''
      });
      fetch(ENDPOINT, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: payload,
        keepalive: true
      }).catch(function () {});
    } catch (e) {}
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', send);
  else send();
  window.addEventListener('hashchange', send);
  window.addEventListener('popstate', send);
})();
</script>
</body>
</html>
